<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Garlic Bread</title>
  <desc id="desc">Illustration of toasted garlic bread slices with herbs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d7a8"/>
      <stop offset="1" stop-color="#e2a55f"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c5c2b"/>
      <stop offset="1" stop-color="#6e3f1d"/>
    </linearGradient>
    <linearGradient id="crumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe5b2"/>
      <stop offset="1" stop-color="#f6cb82"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="660" rx="420" ry="70" fill="#000" opacity="0.12"/>
  <g transform="translate(245 165) rotate(-12 350 220)">
    <rect x="0" y="60" rx="90" ry="90" width="700" height="320" fill="url(#crust)"/>
    <rect x="30" y="90" rx="70" ry="70" width="640" height="260" fill="url(#crumb)"/>
    <g fill="#f2e8bf" opacity="0.8">
      <circle cx="130" cy="180" r="22"/>
      <circle cx="250" cy="150" r="16"/>
      <circle cx="330" cy="215" r="19"/>
      <circle cx="450" cy="165" r="21"/>
      <circle cx="560" cy="225" r="17"/>
    </g>
    <g fill="#4f8a2f">
      <ellipse cx="110" cy="245" rx="7" ry="12" transform="rotate(-24 110 245)"/>
      <ellipse cx="185" cy="205" rx="7" ry="12" transform="rotate(14 185 205)"/>
      <ellipse cx="275" cy="250" rx="7" ry="12" transform="rotate(-12 275 250)"/>
      <ellipse cx="350" cy="185" rx="7" ry="12" transform="rotate(8 350 185)"/>
      <ellipse cx="425" cy="240" rx="7" ry="12" transform="rotate(-18 425 240)"/>
      <ellipse cx="505" cy="190" rx="7" ry="12" transform="rotate(17 505 190)"/>
      <ellipse cx="585" cy="245" rx="7" ry="12" transform="rotate(-10 585 245)"/>
    </g>
    <g stroke="#a26b31" stroke-width="6" opacity="0.4">
      <line x1="165" y1="90" x2="165" y2="350"/>
      <line x1="340" y1="90" x2="340" y2="350"/>
      <line x1="515" y1="90" x2="515" y2="350"/>
    </g>
  </g>
</svg>
